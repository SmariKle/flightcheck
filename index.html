		offset++;

/* ============================================================ Auswertung */
function normText(s){
  return " " + String(s || "").toLowerCase()
    .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
    .replace(/[„“”«»‚‘’`´]/g, '"').replace(/[−–—]/g, "-").replace(/\s*([:=+\-])\s*/g, "$1").replace(/\s+/g, " ") + " ";
}
function conceptHits(p, text){
  const n = normText(text), spaced = n.replace(/([:=+\-])/g, " $1 ").replace(/\s+/g, " ");
  return p.concepts.map(([, pats]) => pats.some(src => { const re = new RegExp(src, "i"); return re.test(n) || re.test(spaced); }));
}
function needsFix(p){ return !!p.fix && p.correct === "fehlerhaft"; }
function gradePart(p, a){
  a = a || {};
  if (p.type === "match"){ const rows = p.rows.map(([w, c]) => ({ w, c, g: a[w] || "", ok: a[w] === c })); const ok = rows.every(r => r.ok);
    return { ok, score: rows.filter(r => r.ok).length / rows.length, rows }; }
  if (p.type === "types"){ const rows = [...p.fields.filter(f => f[1]).map(f => ({ w: f[0], c: f[1] })), ...p.methods.filter(m => m[1]).map(m => ({ w: "newColor", c: m[1] }))]
      .map(r => ({ ...r, g: a[r.w] || "", ok: a[r.w] === r.c })); const ok = rows.every(r => r.ok);
    return { ok, score: rows.filter(r => r.ok).length / rows.length, rows }; }
  if (p.type === "code"){ const ok = normCode(a.code) === p.expect; return { ok, score: ok ? 1 : 0, g: a.code || "", semi: /;\s*$/.test(a.code || "") }; }
  // judge: Urteil + Begründung (+ Korrektur)
  const vOk = a.verdict === p.correct;
  const hits = conceptHits(p, a.text);
  const rScore = hits.filter(Boolean).length / hits.length;
  const fx = needsFix(p);
  const fOk = fx ? normCode(a.fix) === p.fix.expect : true;
  const score = fx ? (vOk ? .3 : 0) + .4 * rScore + (fOk ? .3 : 0) : (vOk ? .4 : 0) + .6 * rScore;
  return { ok: vOk && rScore >= PASS && fOk, score, vOk, rScore, hits, fOk, fx };
}
function grade(test, answers){
  const parts = {}; let sum = 0, n = 0;
  test.items.forEach(it => it.parts.forEach(p => { const g = gradePart(p, answers[p.id]); parts[p.id] = g; sum += g.score; n++; }));
  // Pre: startklar nur, wenn a UND b vollständig richtig sind · Final: wenn die Beurteilung richtig ist
  const status = test.items.map(it => it.parts.every(p => parts[p.id].ok) ? "startklar" : "wartung");
  const judged = test.items.map(it => { const p = it.parts.find(x => x.part === "b"); return parts[p.id].ok; });
  return { parts, points: Math.round(sum * 100), max: n * 100, status, judged };
}

function sceneSVG(){

  const line = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${ink}" stroke-width="1"/>`;
  return `<svg viewBox="-70 0 400 260" width="100%" style="max-width:440px;display:block" role="img" aria-label="Zielbild: Rakete aus Spitze, zwei Rumpfteilen und Fenster, daneben der Mond">

    <polygon points="110,100 90,140 130,140" fill="${red}"/>
    <rect x="90" y="140" width="40" height="40" fill="${blue}"/><rect x="90" y="180" width="40" height="40" fill="${blue}"/>
    <circle cx="110" cy="160" r="10" fill="${yel}"/><circle cx="240" cy="60" r="30" fill="${yel}"/>
    ${line(122, 118, 160, 108)}${lab(164, 112, "spitze")}
    ${line(130, 152, 160, 152)}${lab(164, 156, "rumpfOben")}

  </svg>`;

/* ============================================================ Test durchführen (aufgabenweise) */
function openTest(test){
  const done = Me.done(test.key);
  if (done) return showFeedback(test, done);
  if (test.key === "final" && !Me.done("pre")) return menu();
  if (test.key === "final" && !Me.draft("final") && !openTest.confirmed) return finalGate();
  setURL("test=" + test.key);
  const st = { test, step: 0, ans: (Me.draft(test.key) || {}) };
  renderStep(st);
}
function finalGate(){
  setURL("test=final");
  $app.innerHTML = `<div class="wrap" style="max-width:640px">
    <div class="hero"><div class="badge">D2</div><div><h1>Final-Flight-Check</h1><div class="sub">Abschlussdiagnose · <b class="mono">${esc(Me.ini)}</b></div></div></div>
    <div class="card" style="border-left:6px solid var(--taupe)"><h2>Kurzer Check vor dem Start</h2>
      <p style="font-size:19px;margin:12px 0 6px"><b>Hast du alle Übungen bearbeitet?</b></p>
      <p class="hint" style="margin:0 0 16px">Damit sind deine Übungsbereiche Ü1–Ü3 gemeint: Basis (falls nötig) und Plus. Hast du sie mit den Lösungen an der Lösungsstation verglichen und ins Logbuch eingetragen?</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="yes">Ja, weiter zum Test</button><button class="btn sec" id="no">Nein, zurück zum Hauptmenü</button></div></div></div>`;
  document.getElementById("yes").addEventListener("click", () => { openTest.confirmed = true; openTest(FINAL); });
  document.getElementById("no").addEventListener("click", menu);
}
function renderStep(st){
  const { test } = st, n = test.items.length, it = test.items[st.step], [ar, an] = AREAS[it.area];
  const dots = test.items.map((_, i) => `<span class="dot${i < st.step ? " d" : i === st.step ? " c" : ""}">${i + 1}</span>`).join("");
  $app.innerHTML = `<div class="wrap">
    <div class="hero"><div class="badge">${test.code}</div><div><h1>${esc(test.title)}</h1><div class="sub">${esc(test.sub)} · <b class="mono">${esc(Me.ini)}</b></div></div></div>
    ${test.showScene ? (st.step === 0 ? sceneCard() : `<details class="scenemini"><summary>Zielbild noch einmal ansehen</summary>${sceneCard(true)}</details>`) : ""}
    ${st.step === 0 ? `<p>${md(test.intro)}</p>` : ""}
    <div class="dots">${dots}<span class="hint" style="margin:0 0 0 8px">Aufgabe ${st.step + 1} von ${n}</span></div>
    <form id="f" autocomplete="off"><div class="card item"><div class="itemhead"><span class="num">${st.step + 1}</span><span class="area">${ar} · ${esc(an)}</span></div>
      ${it.parts.map(p => `<div class="part" data-part="${p.id}">${partForm(test, p, st.ans[p.id] || {})}</div>`).join("")}</div>
      <div class="nav"><button type="button" class="btn sec" id="back" ${st.step === 0 ? "style=\"visibility:hidden\"" : ""}>← Zurück</button>
        <button type="submit" class="btn" id="next">${st.step === n - 1 ? "Test abgeben" : "Weiter →"}</button></div>
      <div id="msg" class="hint" style="text-align:right"></div></form>
    <div class="foot"><a href="#" id="tomenu">Zum Hauptmenü (Antworten bleiben gespeichert)</a></div></div>`;
  window.scrollTo(0, 0);
  const f = document.getElementById("f");
  const sync = () => { Object.assign(st.ans, readItem(it, f).ans); Me.setDraft(test.key, st.ans); };
  f.addEventListener("change", e => {
    const t = e.target;
    if (t.type === "radio") f.querySelectorAll(`input[name="${t.name}"]`).forEach(x => x.closest("label").classList.toggle("sel", x.checked));
    if (t.name && t.name.endsWith("_v")){ const w = document.getElementById(t.name.replace("_v", "_fixwrap")); if (w) w.style.display = t.value === "fehlerhaft" ? "" : "none"; }
    const m = t.closest(".missing"); if (m) m.classList.remove("missing");
    sync();
  });
  f.addEventListener("input", e => { const m = e.target.closest(".missing"); if (m) m.classList.remove("missing"); sync(); });
  document.getElementById("back").addEventListener("click", () => { sync(); st.step--; renderStep(st); });
  document.getElementById("tomenu").addEventListener("click", e => { e.preventDefault(); sync(); menu(); });
  f.addEventListener("submit", e => {
    e.preventDefault(); sync();
    const { missing } = readItem(it, f);
    document.querySelectorAll(".missing").forEach(x => x.classList.remove("missing"));
    if (missing.length){
      missing.forEach(sel => { const el = f.querySelector(sel); if (el) el.classList.add("missing"); });
      f.querySelector(missing[0]).scrollIntoView({ behavior: "smooth", block: "center" });
      document.getElementById("msg").innerHTML = `<span class="err">Bitte bearbeite zuerst alle markierten Stellen.</span>`; return;
    }
    if (st.step < n - 1){ st.step++; renderStep(st); return; }
    if (confirm("Test jetzt abgeben? Danach kannst du nichts mehr ändern.")) submitTest(st);
  });
}

function partForm(test, p, a){
  const lab = test.key === "pre" ? `<span class="pl">${p.part})</span>` : "";
  if (p.type === "match"){ const mx = mixed(p); return `<div class="q">${lab}${md(p.q)}</div><div class="matchgrid">` +
    mx.rows.map(([w]) => `<div><div class="w">${esc(w)}</div><select name="${p.id}_${w}">${opts(mx.options, a[w])}</select></div>`).join("") + `</div>`; }
  if (p.type === "types"){
    const mx = mixed(p);
    const sel = n => `<select name="${p.id}_${n}">${opts(mx.options, a[n])}</select>`;
    const at = p.fields.map(([n, need, fixed]) => `${esc(n)}: ${need ? sel(n) : esc(fixed)}`).join("<br>");
    const m = p.methods.map(([t, need, end]) => need ? `${esc(t)}${sel("newColor")}${esc(end)}` : esc(t)).join("<br>");
    return `<div class="q">${lab}${md(p.q)}</div><div class="hint" style="margin:-4px 0 8px">Zur Auswahl stehen ${mx.options.slice(0, -1).join(", ")} und ${mx.options[mx.options.length - 1]}.</div>
      <div class="karte" style="max-width:460px"><div class="h">${esc(p.cls)}</div><div class="a">${at}</div><div style="line-height:1.9">${m}</div></div>`;
  }
  if (p.type === "code") return `<div class="q">${lab}${md(p.q)}</div><input type="text" class="codein" name="${p.id}_code" value="${esc(a.code || "")}" placeholder="${esc(p.placeholder)}" autocapitalize="off" autocorrect="off" spellcheck="false">`;
  const fixShown = a.verdict === "fehlerhaft";
  return `<div class="q">${lab}${md(p.q)}</div>` +
    (p.quote ? `<div class="quote">${md(p.quote)}</div>` : "") +
    (p.ref ? `<div class="q">${md(p.ref.lead)}</div><div style="max-width:470px;margin:4px 0 12px">${kkHTML(p.ref.cls)}</div>` : "") +
    (p.scene ? `<div class="grid2" style="margin:8px 0 12px">${inspHTML(p.scene.insp)}${cardHTML(p.scene.card)}</div>` : "") +
    `<div class="q" style="margin-top:10px">${md(p.task)}</div>
     <div class="lab">Dein Urteil</div><div class="verdict" data-sel="${p.id}_v">` +
    VERDICTS.map(v => `<label class="opt${a.verdict === v ? " sel" : ""}"><input type="radio" name="${p.id}_v" value="${v}"${a.verdict === v ? " checked" : ""}><span>${v}</span></label>`).join("") + `</div>
     <div class="lab">Deine Begründung</div>${test.key === "final" ? `<div class="advice">${md("**Achte auf eine vollständige Begründung:** Nenne das **Kriterium** (welche Regel bzw. welches Startkriterium gilt?), den **Beleg** (was steht in der Übersetzung, was ergibt deine Rechnung?) und die **Schlussfolgerung** (korrekt oder fehlerhaft – und warum?). Ist etwas fehlerhaft, gehört die **Korrektur** dazu. Antworte ausführlich und verwende alle Fachbegriffe, die du gelernt hast.")}</div>` : ""}
     <textarea name="${p.id}_text" maxlength="600" placeholder="${test.key === "final" ? "Kriterium – Beleg – Schlussfolgerung …" : "Die Übersetzung ist …, weil …"}">${esc(a.text || "")}</textarea>` +
    (p.fix ? `<div id="${p.id}_fixwrap" style="display:${fixShown ? "" : "none"}"><div class="lab">${esc(p.fix.q)}</div>
      <input type="text" class="codein" name="${p.id}_fix" value="${esc(a.fix || "")}" placeholder="${esc(p.fix.placeholder)}" autocapitalize="off" autocorrect="off" spellcheck="false"></div>` : "");
}

function readItem(it, f){
  const fd = new FormData(f), ans = {}, missing = [];
  it.parts.forEach(p => {
    const a = {};
    if (p.type === "match"){ p.rows.forEach(([w]) => { a[w] = fd.get(`${p.id}_${w}`) || ""; if (!a[w]) missing.push(`[name="${p.id}_${w}"]`); }); }
    else if (p.type === "types"){
      p.fields.filter(x => x[1]).forEach(([n]) => { a[n] = fd.get(`${p.id}_${n}`) || ""; if (!a[n]) missing.push(`[name="${p.id}_${n}"]`); });
      if (p.methods.some(m => m[1])){ a.newColor = fd.get(`${p.id}_newColor`) || ""; if (!a.newColor) missing.push(`[name="${p.id}_newColor"]`); }
    }
    else if (p.type === "code"){ a.code = (fd.get(`${p.id}_code`) || "").trim(); if (!a.code) missing.push(`[name="${p.id}_code"]`); }
    else {
      a.verdict = fd.get(`${p.id}_v`) || ""; a.text = (fd.get(`${p.id}_text`) || "").trim().slice(0, 600);
      if (p.fix) a.fix = (fd.get(`${p.id}_fix`) || "").trim();
      if (!a.verdict) missing.push(`[data-sel="${p.id}_v"]`);
      if (a.text.length < 15) missing.push(`[name="${p.id}_text"]`);
      if (p.fix && a.verdict === "fehlerhaft" && !a.fix) missing.push(`[name="${p.id}_fix"]`);
    }
    ans[p.id] = a;
  });
  return { ans, missing };
}

async function submitTest(st){
  const { test, ans } = st, g = grade(test, ans), ini = Me.ini;
  const rec = { test: test.key, initials: ini, points: g.points, max_points: g.max,
                status: { areas: g.status, judged: g.judged,
                          parts: Object.fromEntries(Object.entries(g.parts).map(([k, v]) => [k, v.ok])),
                          scores: Object.fromEntries(Object.entries(g.parts).map(([k, v]) => [k, Math.round(v.score * 100)])),
                          reasons: Object.fromEntries(Object.entries(g.parts).filter(([, v]) => v.hits).map(([k, v]) => [k, Math.round(v.rScore * 100)])) },
                answers: ans };
  const btn = document.getElementById("next"), msg = document.getElementById("msg");
  btn.disabled = true; btn.textContent = "Wird gesendet …";
  try { await Store.submit(rec); }
  catch(e){ btn.disabled = false; btn.textContent = "Erneut senden"; msg.innerHTML = `<span class="err">Senden hat nicht geklappt. Prüfe das WLAN und tippe erneut auf „Erneut senden“. (${esc(e.message)})</span>`; return; }
  const done = { ini, ans, at: new Date().toISOString() };
  Me.setDone(test.key, done);
  showFeedback(test, done);
}

/* ============================================================ Rückmeldung */
function showFeedback(test, done){
  setURL("test=" + test.key);
  const g = grade(test, done.ans);
  const time = new Date(done.at).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  let html = `<div class="wrap">
    <div class="hero"><div class="badge">${test.code}</div><div><h1>${esc(test.title)} · Auswertung</h1><div class="sub">Abgegeben um ${time} Uhr · Initialen <b class="mono">${esc(done.ini)}</b></div></div></div>
    <div class="card"><div class="score"><div class="big">${pct(g.points, g.max)} %</div><div>Gesamtergebnis<br><span class="hint" style="margin:0">${g.parts && Object.values(g.parts).filter(x => x.ok).length} von ${Object.keys(g.parts).length} Teilaufgaben vollständig gelöst</span></div></div>
      <div style="margin-top:10px">${AREAS.map(([a, n], i) => `<div class="statrow"><span><b>${a}</b> ${esc(n)}</span>${statusChip(g.status[i])}</div>`).join("")}</div>
      <div class="hint">${test.key === "pre" ? "Status: Teil a (übersetzen) richtig und Teil b (Urteil, Begründung und – falls nötig – Korrektur) richtig → startklar. Ist in a oder b etwas falsch → Wartung nötig, dann startest du bei Basis." : "Status: Urteil richtig, Begründung enthält die wichtigsten Kernpunkte (von zwei beide, von drei mindestens zwei) und – falls nötig – richtig korrigiert → startklar."}</div></div>
    <h2 style="margin-top:26px">Lösungen und Rückmeldung</h2>`;
  test.items.forEach((it, i) => {
    const [ar, an] = AREAS[it.area];
    html += `<div class="card item"><div class="itemhead"><span class="num">${i + 1}</span><span class="area">${ar} · ${esc(an)}</span></div>` +
      it.parts.map(p => fbPart(test, p, done.ans[p.id], g.parts[p.id])).join("") + `</div>`;
  });
  html += test.key === "pre" ? ticket(done.ini, g.status, time) : finalHints(done.ini, g);
  html += `<div style="text-align:center;margin:26px 0"><button class="btn" id="home" style="min-width:260px">Zum Hauptmenü</button></div></div>`;
  $app.innerHTML = html; window.scrollTo(0, 0);
  document.getElementById("home").addEventListener("click", menu);
}
function statusChip(s){ return s === "startklar" ? `<span class="status go">✓ startklar</span>` : `<span class="status wn">⚙ Wartung nötig</span>`; }
function ticket(ini, status, time){
  const rows = AREAS.map(([a, n], i) => {
    const w = status[i] !== "startklar";
    return `<div class="sheet"><span class="nm">${a} · ${esc(n)}</span>
      <span class="chip ${w ? "ba" : "off"}">● BASIS${w ? "" : " – entfällt"}</span><span class="chip pl">✚ PLUS</span>
      <span class="hint" style="margin:0;flex-basis:100%">${w ? "Start bei <b>Basis</b> (Seite 1), danach Plus." : "Du bist startklar: Start direkt bei <b>Plus</b> (Seite 2)."}</span></div>`;
  }).join("");
  return `<div class="ticket"><div class="th"><b>Deine Übungsblätter</b><span class="ini">${esc(ini)}</span></div><div class="tb">
    <p style="margin:0 0 6px"><b>Zeig dieses Feld der Lehrerin.</b> Gegen Vorlage des Tablets bekommst du deine Übungsblätter.</p>${rows}
    <p class="hint" style="margin-top:10px">Reihenfolge: Ü1 → Ü2 → Ü3. <span class="chip zu" style="font-size:12px;padding:2px 8px">★ ZUSATZ</span> erst, wenn du Plus in allen drei Bereichen geschafft hast. Trage deinen Status ins <b>Missions-Logbuch</b> ein (Abschnitt 1) und plane dort dein Training (Abschnitt 2). · ${time} Uhr</p></div></div>`;
}
function finalHints(ini, g){
  const pre = Me.done("pre");
  const pg = pre ? grade(PRE, pre.ans) : null;
  const good = [], work = [];
  AREAS.forEach(([a, n], i) => {
    const ok = g.status[i] === "startklar", before = pg ? pg.status[i] : null;
    let extra = "";
    if (pg && ok && before !== "startklar") extra = " <b>Verbessert seit dem Pre-Flight-Check!</b>";
    if (pg && !ok && before === "startklar") extra = " Im Pre-Flight-Check lief das schon – lies die Startkriterien noch einmal genau.";
    (ok ? good : work).push(`<li><b>${a} ${esc(n)}:</b> ${md(ok ? TIPS[i].good : TIPS[i].work)}${extra}</li>`);
  });
  const reasonAvg = Math.round(100 * FINAL.items.reduce((s, it) => s + g.parts[it.parts[0].id].rScore, 0) / FINAL.items.length);
  const cmp = pg ? `<p style="margin:0 0 8px">Pre-Flight-Check: <b>${pct(pg.points, pg.max)} %</b> · Final-Flight-Check: <b>${pct(g.points, g.max)} %</b> · Sicher beurteilt: vorher ${pg.judged.filter(Boolean).length} von 3, jetzt ${g.judged.filter(Boolean).length} von 3.</p>` : "";
  const style = reasonAvg >= 67 ? "Deine Begründungen nennen die wichtigen Fachbegriffe und Rechnungen – weiter so."
    : "Deine Begründungen werden stärker, wenn du immer **Kriterium – Beleg – Schlussfolgerung** nennst und Rechnungen ausschreibst (Satzmuster: **H2**).";
  return `<div class="card" style="border-left:6px solid var(--slate-d)"><h2>Deine Rückmeldung</h2>${cmp}
    ${good.length ? `<h3 style="margin-top:12px;color:var(--ok)">Das läuft gut</h3><ul class="tips">${good.join("")}</ul>` : ""}
    ${work.length ? `<h3 style="margin-top:14px;color:var(--no)">Daran arbeitest du weiter</h3><ul class="tips">${work.join("")}</ul>` : `<p style="margin-top:12px"><b>Alle drei Bereiche startklar – Mission erfüllt!</b></p>`}
    <p style="margin-top:12px"><b>Begründen:</b> ${md(style)}</p></div>
    <div class="next"><b>So geht es weiter:</b><br>1. Trage deinen <b>neuen Status</b> ins Missions-Logbuch ein (Abschnitt 1) und vergleiche ihn mit dem Pre-Flight-Check.<br>2. Mache mit der <b>Reflexion</b> weiter (Logbuch, Abschnitt 3).</div>`;
}
function fbBox(ok, title, body){ return `<div class="fb ${ok ? "ok" : "no"}"><div class="t"><span class="ico">${ok ? "✓" : "✗"}</span>${title}</div>${body ? `<div class="sol">${body}</div>` : ""}</div>`; }
function fbPart(test, p, a, g){
  a = a || {};
  const lab = test.key === "pre" ? `<span class="pl">${p.part})</span>` : "";
  let h = `<div class="part"><div class="q">${lab}${md(p.q)}</div>`;
  if (p.quote) h += `<div class="quote">${md(p.quote)}</div>`;
  if (p.ref) h += `<div style="max-width:470px;margin:6px 0 10px">${kkHTML(p.ref.cls)}</div>`;
  if (p.scene) h += `<div style="max-width:300px;margin:6px 0 10px">${cardHTML(p.scene.card)}</div>`;
  if (p.type === "match" || p.type === "types"){
    h += g.rows.map(r => fbBox(r.ok, `<span class="mono">${esc(r.w)}</span> → ${esc(r.g || "–")}`, r.ok ? "" : `Richtig: <b>${esc(r.c)}</b>`)).join("");
    h += `<div class="expl">${md(p.expl)}</div>`;
  } else if (p.type === "code"){
    h += fbBox(g.ok, `Deine Nachricht: <span class="mono">${esc(g.g || "–")}</span>`, g.ok ? (g.semi ? "" : "Tipp: Im Quelltext endet jede Anweisung mit einem Semikolon.") : `Richtig: <code>${esc(p.expect)};</code>`);
    h += `<div class="expl">${md(p.expl)}</div>`;
  } else {
    h += fbBox(g.vOk, `Dein Urteil: ${esc(a.verdict || "–")}`, g.vOk ? "" : `Richtig: <b>${esc(p.correct)}</b>`);
    const rp = Math.round(g.rScore * 100);
    h += `<div class="fb ${g.rScore >= PASS ? "ok" : "no"}"><div class="t"><span class="ico">${g.rScore >= PASS ? "✓" : "✗"}</span>Deine Begründung: ${rp} % der Kernpunkte</div>
      <div class="free" style="font-style:normal">${esc(a.text || "–")}</div>
      <ul class="concepts">${p.concepts.map(([t], i) => `<li class="${g.hits[i] ? "y" : "n"}">${g.hits[i] ? "✓" : "○"} ${md(t)}</li>`).join("")}</ul></div>`;
    if (g.fx) h += fbBox(g.fOk, `Korrektur: <span class="mono">${esc(a.fix || "–")}</span>`, g.fOk ? "" : `Richtig: <code>${esc(p.fix.expect)};</code>`);
    h += `<div class="expl"><b>Musterlösung:</b> ${md(p.model)}</div>`;
  }
  return h + `</div>`;
}

async function loadData(){

  catch(e){ T.err = e.message; if (e.auth){ sessionStorage.removeItem("fc_teacher"); location.reload(); } }

function students(){
  // pro Initialen die ERSTE Abgabe je Test (spätere Abgaben werden gezählt, aber nicht gewertet)
  const map = new Map();
  [...T.data].sort((a, b) => String(a.created_at).localeCompare(String(b.created_at))).forEach(r => {
    const k = normIni(r.initials); if (!k) return;
    if (!map.has(k)) map.set(k, { ini: k, pre: null, final: null, n: { pre: 0, final: 0 } });
    const s = map.get(k); s.n[r.test] = (s.n[r.test] || 0) + 1;
    if (!s[r.test]) s[r.test] = r;
  });
  const list = [...map.values()].sort((a, b) => a.ini.localeCompare(b.ini, "de"));
  list.forEach((s, i) => { s.sn = "S" + (i + 1); });
  return list;
}
const P = r => r ? pct(r.points, r.max_points) : null;
const areasOf = r => (r && r.status && r.status.areas) || null;
function sheetsFor(s){
  const a = areasOf(s.pre); if (!a) return null;
  return AREAS.map(([ar], i) => a[i] === "startklar" ? `${ar} Plus` : `${ar} Basis + Plus`);
}

function setAuto(on){ clearInterval(T.timer); T.timer = on ? setInterval(() => { if (T.tab !== "qr") refresh(); }, 15000) : null; }
async function refresh(){ await loadData(); renderView(); }

function renderView(){
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.t === T.tab));
  const st = students();
  const nPre = st.filter(s => s.pre).length, nFin = st.filter(s => s.final).length;
  document.getElementById("meta").innerHTML = (T.err ? `<span class="err">Fehler beim Laden: ${esc(T.err)}</span> · ` : "") +
    `${nPre} Pre-Abgaben · ${nFin} Final-Abgaben · Stand ${T.loaded ? T.loaded.toLocaleTimeString("de-DE") : "–"}${DB_ON ? "" : " · Demo-Modus"}`;

  if (T.tab === "uebersicht") v.innerHTML = overview(st);
  else if (T.tab === "grafik") v.innerHTML = chartsView(st);
  else v.innerHTML = qrView();

    v.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => { T.open[b.dataset.open] = !T.open[b.dataset.open]; renderView(); }));
    v.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
      if (!confirm(`Alle Abgaben von ${b.dataset.del} löschen?`)) return; await Store.remove(T.code, b.dataset.del); refresh(); }));

  if (T.tab === "grafik"){ bindChart(st); const t = document.getElementById("showini"); if (t) t.addEventListener("change", e => { T.showIni = e.target.checked; renderView(); }); }

function pctCell(p, color){
  if (p === null) return `<span class="hint">–</span>`;
  return `<div class="pct"><div class="bar"><i style="width:${p}%;background:${color}"></i></div><b>${p} %</b></div>`;
}
function miniStatus(r){
  const a = areasOf(r); if (!a) return `<span class="hint">–</span>`;
  return `<span class="mini">${a.map((s, i) => `<span class="${s === "startklar" ? "go" : "wn"}" title="${AREAS[i][0]}: ${s === "startklar" ? "startklar" : "Wartung nötig"}">${AREAS[i][0]}</span>`).join("")}</span>`;
}
function overview(st){
  if (!st.length) return `<div class="empty">Noch keine Abgaben. Die QR-Codes für die Schüler findest du im Reiter „QR-Codes“.</div>`;
  const avg = arr => arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : null;
  const pres = st.filter(s => s.pre).map(s => P(s.pre)), fins = st.filter(s => s.final).map(s => P(s.final));
  const both = st.filter(s => s.pre && s.final);
  const up = both.filter(s => P(s.final) > P(s.pre)).length, eq = both.filter(s => P(s.final) === P(s.pre)).length;
  const basisCount = i => st.filter(s => areasOf(s.pre) && areasOf(s.pre)[i] !== "startklar").length;
  let h = `<div class="tiles">
    <div class="tile"><div class="v" style="color:var(--pre)">${avg(pres) ?? "–"}${pres.length ? " %" : ""}</div><div class="k">Ø Pre-Flight-Check (${pres.length})</div></div>
    <div class="tile"><div class="v" style="color:var(--fin)">${avg(fins) ?? "–"}${fins.length ? " %" : ""}</div><div class="k">Ø Final-Flight-Check (${fins.length})</div></div>
    <div class="tile"><div class="v">${both.length ? up : "–"}</div><div class="k">verbessert · ${both.length ? eq : "–"} gleich · ${both.length ? both.length - up - eq : "–"} schlechter</div></div>
    <div class="tile"><div class="v">${AREAS.map((a, i) => basisCount(i)).join(" · ")}</div><div class="k">Basisblätter Ü1 · Ü2 · Ü3 benötigt</div></div></div>
    <div class="tablewrap"><table class="res"><thead><tr><th>Nr.</th><th>Initialen</th><th>Pre %</th><th>Pre-Status</th><th>Übungsblätter</th><th>Final %</th><th>Final-Status</th><th>Entwicklung<br>(%-Punkte)</th><th></th></tr></thead><tbody>`;
  st.forEach(s => {
    const sh = sheetsFor(s), d = s.pre && s.final ? P(s.final) - P(s.pre) : null;
    const multi = (s.n.pre > 1 || s.n.final > 1) ? ` <span class="hint" title="Mehrere Abgaben – gewertet wird jeweils die erste">(${s.n.pre}/${s.n.final} Abg.)</span>` : "";
    h += `<tr><td class="mono">${s.sn}</td><td class="mono"><b>${esc(s.ini)}</b>${multi}</td><td>${pctCell(P(s.pre), "var(--pre)")}</td><td>${miniStatus(s.pre)}</td>
      <td>${sh ? sh.map(x => `<div style="white-space:nowrap">${/Basis/.test(x) ? `<b>${esc(x)}</b>` : esc(x)}</div>`).join("") : `<span class="hint">–</span>`}</td>
      <td>${pctCell(P(s.final), "var(--fin)")}</td><td>${miniStatus(s.final)}</td>
      <td class="delta" style="color:${d === null ? "var(--faint)" : d > 0 ? "var(--ok)" : d < 0 ? "var(--no)" : "var(--muted)"}">${d === null ? "–" : (d > 0 ? "▲ +" : d < 0 ? "▼ " : "= ") + d}</td>
      <td class="noprint"><button class="linkbtn" data-open="${esc(s.ini)}">${T.open[s.ini] ? "schließen" : "Details"}</button></td></tr>`;
    if (T.open[s.ini]) h += `<tr class="det"><td></td><td colspan="8">${details(s)}</td></tr>`;
  });
  h += `</tbody></table></div><p class="hint">Gewertet wird je Test die <b>erste</b> Abgabe pro Initialen. „Basis + Plus“ = Status „Wartung nötig“ im Pre-Flight-Check (Fehler in Teil a oder b).</p>`;
  return h;
}
function details(s){
  const block = (test, r) => {
    if (!r) return `<div><h4>${test.title}</h4><span class="hint">noch keine Abgabe</span></div>`;
    const t = new Date(r.created_at).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    let h = `<div><h4>${test.title} · ${t} Uhr · ${P(r)} %</h4><div class="dl">`;
    test.items.forEach(it => it.parts.forEach(p => {
      const a = (r.answers && r.answers[p.id]) || {}, g = gradePart(p, a);
      h += `<span class="${g.ok ? "y" : "n"}">${g.ok ? "✓" : "✗"} ${p.id}</span><span>${esc(AREAS[it.area][0])} · ${p.part === "a" ? "übersetzen" : "beurteilen"} · ${Math.round(g.score * 100)} %${answerSummary(p, a, g)}</span>`;
    }));
    h += `</div>`;
    test.items.forEach(it => it.parts.forEach(p => { const a = r.answers && r.answers[p.id]; if (a && a.text) h += `<div class="free"><b>${p.id}:</b> ${esc(a.text)}</div>`; }));
    return h + `</div>`;
  };
  return `<div class="detgrid">${block(PRE, s.pre)}${block(FINAL, s.final)}</div>
    <div style="margin-top:10px"><button class="btn small warn" data-del="${esc(s.ini)}">Abgaben von ${esc(s.ini)} löschen</button></div>`;
}
function answerSummary(p, a, g){
  if (p.type === "code") return ` · <span class="mono">${esc(a.code)}</span>`;
  if (p.type === "judge") return ` · Urteil ${esc(a.verdict || "–")} ${g.vOk ? "✓" : "✗"} · Begründung ${Math.round(g.rScore * 100)} %${g.fx ? ` · Korrektur <span class="mono">${esc(a.fix || "–")}</span> ${g.fOk ? "✓" : "✗"}` : ""}`;
  return "";
}

/* ---------- Grafiken (SVG, ohne Bibliothek) */
function chartsView(st){
  const rows = st.filter(s => s.pre || s.final);
  if (!rows.length) return `<div class="empty">Noch keine Daten für die Grafik.</div>`;
  const W = Math.max(700, 150 + rows.length * 56), H = 380, L = 56, R = 104, TOP = 20, B = 44;
  const x = i => L + (i + .5) * (W - L - R) / rows.length, y = v => TOP + (100 - v) / 100 * (H - TOP - B);
  let g = "";
  for (let v = 0; v <= 100; v += 25) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e7ec"/><text x="${L - 10}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="#5d6676">${v} %</text>`;
  const avg = k => { const a = rows.filter(s => s[k]).map(s => P(s[k])); return a.length ? a.reduce((p, c) => p + c, 0) / a.length : null; };
  [["pre", "var(--pre)", "Ø Pre"], ["final", "var(--fin)", "Ø Final"]].forEach(([k, c, lab]) => {
    const a = avg(k); if (a === null) return;
    g += `<line x1="${L}" x2="${W - R}" y1="${y(a)}" y2="${y(a)}" stroke="${c}" stroke-width="1.5" stroke-dasharray="6 5" opacity=".8"/>`;
    g += `<text x="${W - R + 8}" y="${y(a) + (k === "pre" && avg("final") !== null && Math.abs(avg("final") - a) < 6 ? (a < avg("final") ? 14 : -6) : 4)}" font-size="12" font-weight="600" fill="#3b5361">${lab} ${Math.round(a)} %</text>`;
  });
  rows.forEach((s, i) => {
    const xp = x(i), p = P(s.pre), f = P(s.final);
    if (p !== null && f !== null && p !== f) g += `<line x1="${xp}" x2="${xp}" y1="${y(p)}" y2="${y(f)}" stroke="${f > p ? "#22764a" : "#b3261e"}" stroke-width="2.5"/>`;
    const off = p !== null && f !== null && p === f ? 7 : 0;
    if (p !== null) g += `<circle cx="${xp - off}" cy="${y(p)}" r="7" fill="#b27a2a" stroke="#fff" stroke-width="2"/>`;
    if (f !== null) g += `<circle cx="${xp + off}" cy="${y(f)}" r="7" fill="#1f6fb0" stroke="#fff" stroke-width="2"/>`;
    g += `<text x="${xp}" y="${H - B + 20}" text-anchor="middle" font-size="12" fill="#1c2431" font-family="IBM Plex Mono, monospace">${esc(T.showIni ? s.ini : s.sn)}</text>`;
    g += `<rect class="hit" data-i="${i}" x="${xp - 24}" y="${TOP}" width="48" height="${H - TOP - B + 26}" fill="transparent"/>`;
  });
  const dumb = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${Math.min(W, 640)}px" role="img" aria-label="Pre- und Final-Ergebnis je Schüler">${g}</svg>`;
  // Übungsbereiche: Anteil startklar
  const share = (k, i) => { const a = rows.filter(s => areasOf(s[k])); return a.length ? Math.round(100 * a.filter(s => areasOf(s[k])[i] === "startklar").length / a.length) : null; };
  const BW = 640, BH = 260, bl = 56, bb = 40, bt = 16, gw = (BW - bl - 20) / 3;
  const by = v => bt + (100 - v) / 100 * (BH - bt - bb);
  let b = "";
  for (let v = 0; v <= 100; v += 25) b += `<line x1="${bl}" x2="${BW - 20}" y1="${by(v)}" y2="${by(v)}" stroke="#e3e7ec"/><text x="${bl - 10}" y="${by(v) + 4}" text-anchor="end" font-size="12" fill="#5d6676">${v} %</text>`;
  AREAS.forEach(([a, n], i) => {
    [["pre", "#b27a2a"], ["final", "#1f6fb0"]].forEach(([k, c], j) => {
      const v = share(k, i); if (v === null) return;
      const x0 = bl + i * gw + gw / 2 - 46 + j * 48, h = Math.max(0, by(0) - by(v));
      b += `<path d="M${x0} ${by(0)} V${by(v) + Math.min(4, h)} q0 -4 4 -4 h36 q4 0 4 4 V${by(0)} Z" fill="${c}"/>`;
      b += `<text x="${x0 + 22}" y="${by(v) - 6}" text-anchor="middle" font-size="12" font-weight="600" fill="#1c2431">${v} %</text>`;
    });
    b += `<text x="${bl + i * gw + gw / 2}" y="${BH - bb + 22}" text-anchor="middle" font-size="13" fill="#1c2431">${a} ${esc(n)}</text>`;
  });
  const bars = `<svg viewBox="0 0 ${BW} ${BH}" width="100%" style="max-width:760px" role="img" aria-label="Anteil startklar je Übungsbereich">${b}</svg>`;
  return `<div class="chartcard" id="dumbcard"><h3>Ergebnis je Schüler · Pre und Final</h3>
      <div class="legend"><span><i style="background:#b27a2a"></i>Pre-Flight-Check</span><span><i style="background:#1f6fb0"></i>Final-Flight-Check</span>
        <span><span style="display:inline-block;width:18px;border-top:2.5px solid #22764a;vertical-align:4px;margin-right:6px"></span>verbessert</span>
        <span><span style="display:inline-block;width:18px;border-top:2.5px solid #b3261e;vertical-align:4px;margin-right:6px"></span>verschlechtert</span>
        <span><span style="display:inline-block;width:18px;border-top:2px dashed #3b5361;vertical-align:4px;margin-right:6px"></span>Kursdurchschnitt</span>
        <label class="noprint" style="margin-left:auto;display:flex;gap:6px;align-items:center"><input type="checkbox" id="showini" ${T.showIni ? "checked" : ""}> Initialen statt S-Nummern</label></div>
      <div style="overflow-x:auto">${dumb}</div><div class="tip" id="tip"></div>
      <p class="hint">Jeder Schüler hat zwei Punkte: Pre (ocker) und Final (blau). Die S-Nummern entsprechen der Übersichtstabelle; für den Beamer bleiben die Initialen ausgeblendet.</p></div>
    <div class="chartcard"><h3>Anteil „startklar“ je Übungsbereich</h3>
      <div class="legend"><span><i style="background:#b27a2a"></i>Pre-Flight-Check (a und b richtig)</span><span><i style="background:#1f6fb0"></i>Final-Flight-Check (beurteilen)</span></div>${bars}</div>`;
}
function bindChart(st){
  const rows = st.filter(s => s.pre || s.final), tip = document.getElementById("tip"), card = document.getElementById("dumbcard");
  if (!tip) return;
  document.querySelectorAll(".hit").forEach(r => {
    const show = e => {
      const s = rows[+r.dataset.i], p = P(s.pre), f = P(s.final);
      tip.innerHTML = `<b>${esc(T.showIni ? s.ini : s.sn)}</b><br>Pre: ${p === null ? "–" : p + " %"}<br>Final: ${f === null ? "–" : f + " %"}${p !== null && f !== null ? `<br>Δ ${f - p > 0 ? "+" : ""}${f - p} Prozentpunkte` : ""}`;
      const cr = card.getBoundingClientRect(), rr = r.getBoundingClientRect();
      tip.style.display = "block";
      tip.style.left = Math.min(cr.width - tip.offsetWidth - 8, Math.max(8, rr.left - cr.left + rr.width / 2 - tip.offsetWidth / 2)) + "px";
      tip.style.top = (rr.top - cr.top + 40) + "px";
    };
    r.addEventListener("mouseenter", show); r.addEventListener("click", show);
    r.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  });
}

/* ---------- QR-Codes */
function baseURL(){ return location.href.split("?")[0].split("#")[0]; }
function qrView(){
  const local = location.protocol === "file:";
  return `${local ? `<div class="card" style="border-color:#f0dc9d;background:#fff8e6"><b>Hinweis:</b> Die App läuft gerade als Datei auf diesem Gerät. QR-Codes funktionieren erst, wenn die App online steht (siehe Anleitung).</div>` : ""}
    <div class="qrs">
      <div class="qr"><h2>Pre-Flight-Check</h2><canvas id="qrpre"></canvas><div class="u">${esc(baseURL())}?test=pre</div></div>
      <div class="qr"><h2>Final-Flight-Check</h2><canvas id="qrfin"></canvas><div class="u">${esc(baseURL())}?test=final</div></div></div>
    <div class="toolbar noprint" style="margin-top:14px"><button class="btn sec" onclick="window.print()">QR-Codes drucken</button>
      <span class="hint">Lehreransicht: <span class="mono">${esc(baseURL())}?lehrer</span></span></div>`;
}
function drawQR(id, text){
  const c = document.getElementById(id); if (!c || !window.QRLIB) return;
  const q = new QRLIB.QRCode(-1, QRLIB.ECL.M); q.addData(text); q.make();
  const n = q.getModuleCount(), sc = 10, pad = 4;
  c.width = c.height = (n + 2 * pad) * sc;
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.fillStyle = "#1c2431";
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect((k + pad) * sc, (r + pad) * sc, sc, sc);
}
function drawQRs(){ drawQR("qrpre", baseURL() + "?test=pre"); drawQR("qrfin", baseURL() + "?test=final"); }

/* ---------- Export und Demo */
function exportCSV(){
  const st = students();
  const head = ["Nr", "Initialen", "Pre_Prozent", "Pre_U1", "Pre_U2", "Pre_U3", "Uebungsblaetter", "Final_Prozent", "Final_U1", "Final_U2", "Final_U3", "Entwicklung"];
  const lines = [head.join(";")];
  st.forEach(s => {
    const a = areasOf(s.pre) || ["", "", ""], b = areasOf(s.final) || ["", "", ""];
    const d = s.pre && s.final ? P(s.final) - P(s.pre) : "";
    lines.push([s.sn, s.ini, P(s.pre) ?? "", ...a, (sheetsFor(s) || []).join(" | "), P(s.final) ?? "", ...b, d].join(";"));
  });
  const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "flightcheck_ergebnisse.csv"; document.body.appendChild(a); a.click(); a.remove();
}
function demoData(){
  const names = ["AB", "CD", "EK", "FL", "GM", "HN", "JO", "KP", "LR", "MS", "NT", "PW"];
  const rnd = (i, k) => ((i * 7 + k * 13) % 10) / 10;
  const all = ls.get(DEMO_KEY) || [];
  const texts = { "1b": ["Beide sind Objekte derselben Klasse Circle und unterscheiden sich nur in den Attributwerten.", "Weil beide rund sind."],
    "2b": ["Der Kopf ist vertauscht, richtig ist fenster : Circle. 20.0 muss 20 sein, weil int.", "Die Farbe ist falsch geschrieben."],
    "3b": ["moveHorizontal verschiebt um 210, dann ist er bei 230. Richtig wäre 210 - 20 = 190.", "Er muss nach rechts."],
    "F1": ["spitze ist ein Objekt, color ein Attribut und red der Wert.", "Das stimmt so."],
    "F2": ["size: int ist ein Datentyp, auf die Objektkarte gehört size = 40. blue braucht Anführungszeichen.", "size ist falsch."],
    "F3": ["moveVertical verschiebt um 100, also 15 + 100 = 115. Richtig: 100 - 15 = 85.", "Das ist zu weit."] };
  names.forEach((n, i) => {
    ["pre", "final"].forEach((t, k) => {
      if (t === "final" && i === 11) return;
      const test = TESTS[t], ans = {};
      test.items.forEach(it => it.parts.forEach((p, j) => {
        const good = rnd(i + j, k + it.area) < (t === "pre" ? .55 : .8);
        if (p.type === "match") ans[p.id] = Object.fromEntries(p.rows.map(([w, c], q) => [w, good || q ? c : "Klasse"]));
        else if (p.type === "types") ans[p.id] = { diameter: "int", color: good ? "String" : "int", isVisible: "boolean", newColor: "String" };
        else if (p.type === "code") ans[p.id] = { code: good ? "mond.moveVertical(-30);" : "mond.moveVertical(30);" };
        else ans[p.id] = { verdict: good ? p.correct : VERDICTS.find(v => v !== p.correct), text: texts[p.id][good ? 0 : 1], fix: p.fix ? (good ? p.fix.expect + ";" : "") : undefined };
      }));
      const g = grade(test, ans);
      all.push({ id: Date.now() + i * 10 + k, created_at: new Date(Date.now() - (2 - k) * 600000 + i * 1000).toISOString(), test: t, initials: n, points: g.points, max_points: g.max,
                 status: { areas: g.status, judged: g.judged, parts: Object.fromEntries(Object.entries(g.parts).map(([q, v]) => [q, v.ok])) }, answers: ans });
    });
  });
  ls.set(DEMO_KEY, all);
}
